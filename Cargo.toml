[package]
authors = ["Oleksii Karpenko <alexkarpenko@yahoo.com>"]
description = "Kubernetes operator to run Jobs on events from Git"
documentation = "https://alex-karpenko.github.io/git-events-runner"
edition = "2024"
homepage = "https://alex-karpenko.github.io/git-events-runner"
keywords = ["kubernetes", "operator", "git", "events", "runner"]
license = "MIT"
name = "git-events-runner"
readme = "README.md"
repository = "https://github.com/alex-karpenko/git-events-runner"
rust-version = "1.89"
version = "0.4.16"

[[bin]]
doc = false
name = "git-events-runner"
path = "src/bin/git-events-runner.rs"

[[bin]]
doc = false
name = "gitrepo-cloner"
path = "src/bin/gitrepo-cloner.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "macros",
    "matched-path",
    "original-uri",
    "tokio",
    "tracing",
    "tower-log",
    "json",
] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
git2 = { version = "0.21.0", features = ["https", "ssh"] }
globwalk = "0.9.1"
hex = "0.4.3"
humantime = "2.4.0"
k8s-openapi = { version = "0.28.0", features = ["v1_32", "schemars"] }
kube = { version = "4.2.0", features = ["runtime", "client", "derive", "unstable-runtime"] }
kube-lease-manager = { version = "0.12.0" }
rand = "0.10.3"
rustls = { version = "0.23.46", features = ["std", "tls12", "aws-lc-rs"], default-features = false }
rustls-native-certs = "0.8.5"
rustls-pki-types = "1.15.1"
sacs = { version = "0.9.5", features = ["async-trait", "tz"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.0.0"
sha2 = "0.11.1"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync"] }
tonic = { version = "0.14.6" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
opentelemetry = { version = "0.33.1", features = ["trace", "logs"] }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio", "tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = ["tokio", "trace", "tonic", "grpc-tonic"] }
tracing-opentelemetry = "0.34.0"
uuid = { version = "1.29.0", features = ["v4"] }
prometheus = { version = "0.14.0", default-features = false }
tower_governor = { version = "0.8.0", features = ["tracing"] }

[dev-dependencies]
base64 = "0.23.1"
dtor = "1.0.6"
insta = { version = "1.49.0", features = ["glob", "ron", "redactions", "filters", "yaml"] }
rstest = "0.28.0"
rstest_reuse = "0.7.1"
tempfile = "3.27.0"
testcontainers = { version = "0.27.0", default-features = false }
testcontainers-modules = { version = "0.15.0", default-features = false, features = ["gitea"] }
# testcontainers-modules = { default-features = false, features = ["gitea"], git = "https://github.com/alex-karpenko/testcontainers-rs-modules-community", branch = "fix/update-testcontainers-version"}

[build-dependencies]
anyhow = "1.0.104"
