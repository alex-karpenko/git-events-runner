[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Temporary exceptions for unmaintained crates (no maintained replacements adopted yet).
# Keep in sync with .cargo/audit.toml.
ignore = [
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained (dev-only, via testcontainers)" },
    { id = "RUSTSEC-2026-0542", reason = "humantime is unmaintained" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained (via sacs -> cron-lite)" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.93
exceptions = [{ allow = ["Zlib"], name = "foldhash" }]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "ISC"
license-files = [
    # Each entry is a crate relative path, and the (opaque) hash of its contents
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# allow-git = ["https://github.com/alex-karpenko/testcontainers-rs-modules-community?branch=fix%2Fupdate-testcontainers-version"]

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1
